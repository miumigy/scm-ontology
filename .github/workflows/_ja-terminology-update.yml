name: Update Japanese terminology

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace canonical terminology in Japanese README
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.ja.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('Canonical Semantic Model（カノニカル意味モデル）', '基準意味モデル（Canonical Semantic Model）'),
              ('Canonical Semantic Model', '基準意味モデル（Canonical Semantic Model）'),
              ('Canonical Truth（カノニカルな真実）', '基準情報（Canonical Truth）'),
              ('Canonical Truth', '基準情報（Canonical Truth）'),
              ('Canonical Fact', '基準事実（Canonical Fact）'),
              ('Canonical Graph', '基準グラフ（Canonical Graph）'),
              ('Canonical Identity', '基準識別子（Canonical Identity）'),
              ('Canonical State', '基準状態（Canonical State）'),
              ('Canonical Event', '基準イベント（Canonical Event）'),
              ('カノニカルなエンティティ', '基準エンティティ'),
              ('カノニカル・レジストリ', '基準レジストリ'),
              ('カノニカル化', '基準化'),
              ('canonicalization', '基準化'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          # Avoid duplicated parenthetical English labels introduced by repeated replacements.
          s = s.replace('基準意味モデル（Canonical Semantic Model）（Canonical Semantic Model）', '基準意味モデル（Canonical Semantic Model）')
          s = s.replace('基準情報（Canonical Truth）（Canonical Truth）', '基準情報（Canonical Truth）')
          s = s.replace('基準事実（Canonical Fact）（Canonical Fact）', '基準事実（Canonical Fact）')
          s = s.replace('基準グラフ（Canonical Graph）（Canonical Graph）', '基準グラフ（Canonical Graph）')
          s = s.replace('基準識別子（Canonical Identity）（Canonical Identity）', '基準識別子（Canonical Identity）')
          s = s.replace('基準状態（Canonical State）（Canonical State）', '基準状態（Canonical State）')
          s = s.replace('基準イベント（Canonical Event）（Canonical Event）', '基準イベント（Canonical Event）')
          s = s.replace('基準意味モデル（Canonical Semantic Model）上', '基準意味モデル上')
          s = s.replace('基準意味モデル（Canonical Semantic Model）の上', '基準意味モデルの上')
          s = s.replace('基準情報（Canonical Truth）も変更しません', '基準情報も変更しません')
          s = s.replace('基準情報（Canonical Truth）を直接変更', '基準情報を直接変更')
          s = s.replace('基準情報（Canonical Truth）と派生結果', '基準情報と派生結果')
          s = s.replace('基準情報（Canonical Truth）を暗黙に変更しない', '基準情報を暗黙に変更しない')
          s = s.replace('基準情報（Canonical Truth）と派生情報', '基準情報と派生情報')
          if '## ライセンス' not in s:
              s = s.rstrip() + '\n\n## ライセンス\n\nこのプロジェクトは[MIT License](./LICENSE)の下で公開されています。\n\nCopyright (c) 2026 miumigy.\n'
          p.write_text(s, encoding='utf-8')
      - name: Commit terminology update and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.ja.md .github/workflows/_ja-terminology-update.yml
          git rm .github/workflows/_ja-terminology-update.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs: improve Japanese terminology for canonical concepts'
          git push
