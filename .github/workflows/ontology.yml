name: SCM Ontology Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m scm_ontology.validator
      - run: PYTHONPATH=src python -m scm_ontology.primary_launch --self-check
      - run: PYTHONPATH=src python -m scm_ontology.primary_launch_acceptance --self-check
      - run: PYTHONPATH=src pytest -q
