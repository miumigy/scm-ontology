version: "1.0"
project: scm-ontology
status: post_primary_launch
principle: "After v0.1.0, plan by public releases and capability outcomes; do not extend the historical S/M/Phase sequence indefinitely."

release_policy:
  current_release: "0.1.0"
  next_release: "0.2.0"
  historical_identifiers:
    status: archived
    note: "Sxxx/Mxx/Phase identifiers remain in historical documents for traceability and are not the active planning mechanism."

post_launch_backlog:
  - id: enterprise-connectors
    status: planned
    priority: P1
    outcome: "Governed adapters for ERP/WMS/TMS/APS source evidence."
  - id: production-observability
    status: planned
    priority: P1
    outcome: "Operational metrics, tracing, failure visibility, and deployment diagnostics."
  - id: production-scale-graph
    status: planned
    priority: P1
    outcome: "Measured scale, indexing, performance, HA, backup, and recovery boundaries."
  - id: enterprise-identity-and-tenancy
    status: planned
    priority: P1
    outcome: "Explicit tenant, identity, authorization, and enterprise security boundaries."
  - id: scm-business-applications
    status: planned
    priority: P1
    outcome: "Expand governed SCM business questions and decision applications."
  - id: planning-and-simulation-integration
    status: planned
    priority: P1
    outcome: "Deeper integration with planning, simulation, and optimization workflows."
  - id: governed-agent-capabilities
    status: planned
    priority: P2
    outcome: "More capable policy-bounded reasoning and proposal providers without bypassing governance."
  - id: developer-experience
    status: planned
    priority: P2
    outcome: "Examples, adapters, extension templates, and improved onboarding."
