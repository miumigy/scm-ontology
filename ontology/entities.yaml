version: "0.1"
entities:
  Party:
    description: SCM network participant
    properties: [id, name, partyType]
  Site:
    description: Physical or logical supply-chain site
    properties: [id, name, siteType, locationId]
  Location:
    description: Geographic or logical location
    properties: [id, name, locationType, countryCode]
  Lane:
    description: Directed logistics connection between supply-chain nodes
    properties: [id, name, laneType, transportMode, distance, distanceUom, leadTimeDays, capacity, capacityUom, validFrom, validTo]
  Product:
    description: Item that can be demanded, supplied, stocked or transformed
    properties: [id, name, productType, uom]
  Material:
    description: Input material or component
    extends: Product
  ProductLocation:
    description: Product-specific supply-chain context at a site or location
    properties: [id, productId, siteId, locationId, planningStatus, sourcingType, leadTimeDays, lotSize, lotSizeUom, safetyStock, reorderPoint, onHand, available, inTransit, asOf]
  BOM:
    description: Bill of material
    properties: [id, productId, version]
  BOMLine:
    description: Component relationship within a BOM
    properties: [id, quantity, uom, scrapRate]
  InventoryPosition:
    description: Inventory state for a product at a site
    properties: [id, onHand, allocated, available, onOrder, inTransit, backOrder, safetyStock, asOf]
  Demand:
    description: Demand signal for a product at a location
    properties: [id, quantity, uom, demandDate, demandType]
  Forecast:
    description: Forecasted demand
    properties: [id, quantity, uom, forecastDate, horizon]
  Plan:
    description: Supply-chain planning artifact
    properties: [id, planType, horizonStart, horizonEnd, version]
  Order:
    description: Business order
    properties: [id, orderNumber, orderDate, requestedDate, quantity, uom, status]
  PurchaseOrder:
    description: Procurement order
    extends: Order
  ProductionOrder:
    description: Manufacturing order
    extends: Order
  Shipment:
    description: Physical movement of goods
    properties: [id, shipmentNumber, plannedDeparture, actualDeparture, plannedArrival, actualArrival, status]
  Capacity:
    description: Available operational capacity
    properties: [id, quantity, uom, periodStart, periodEnd]
  Constraint:
    description: Constraint limiting a decision or flow
    properties: [id, constraintType, value, uom]
  Policy:
    description: Business rule governing SCM decisions
    properties: [id, policyType, parameters]
  Decision:
    description: Supply-chain decision
    properties: [id, decisionType, objective, decisionDate]
  DecisionOption:
    description: Candidate option for a decision
    properties: [id, description, expectedCost, expectedService]
  Event:
    description: State-changing event
    properties: [id, eventType, occurredAt, sourceSystem, sourceId]
  State:
    description: State of an SCM object at a point in time
    properties: [id, stateType, effectiveAt, attributes]
  KPI:
    description: Supply-chain performance metric
    properties: [id, metricType, value, uom, measuredAt]
  Risk:
    description: Supply-chain risk or exposure
    properties: [id, riskType, severity, probability]
  Cost:
    description: Cost associated with a supply-chain object or activity
    properties: [id, costType, amount, currency, periodStart, periodEnd]
